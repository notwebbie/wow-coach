name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test -p wow-coach-core -p wow-coach-cli --all-targets
      - run: cargo clippy -p wow-coach-core -p wow-coach-cli --all-targets -- -D warnings

  wasm:
    name: Core compiles to wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo build -p wow-coach-core --target wasm32-unknown-unknown
      - run: cargo clippy -p wow-coach-core --target wasm32-unknown-unknown -- -D warnings
      # The architecture promises one core compiled twice. Until this job
      # existed the wasm half had never been built, only asserted.
      - name: No JS shim in the browser bundle
        run: |
          if cargo tree -p wow-coach-core --target wasm32-unknown-unknown -e normal \
               | grep -E 'wasm-bindgen|js-sys'; then
            echo "::error::wasm-bindgen reached the core. Something enabled chrono's" \
                 "clock feature (or added a JS-backed dependency). The core takes the" \
                 "time as a parameter and must not need a JS shim."
            exit 1
          fi

  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  desktop-rust:
    name: Desktop Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Generate native icons from tracked SVG
        run: npm run tauri icon src-tauri/icons/icon.svg
        working-directory: apps/desktop
      - run: cargo check -p wow-coach-desktop --features desktop-runtime
