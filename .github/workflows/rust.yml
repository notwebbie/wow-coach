name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test -p wow-coach-core -p wow-coach-cli -p wow-coach-wasm --all-targets
      - run: cargo clippy -p wow-coach-core -p wow-coach-cli -p wow-coach-wasm --all-targets -- -D warnings

  wasm:
    name: Core compiles to wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo build -p wow-coach-core --target wasm32-unknown-unknown
      - run: cargo build -p wow-coach-wasm --target wasm32-unknown-unknown
      - run: cargo clippy -p wow-coach-core --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p wow-coach-wasm --target wasm32-unknown-unknown -- -D warnings
      # The architecture promises one core compiled twice. Until this job
      # existed the wasm half had never been built, only asserted.
      # Scoped to the core on purpose: wow-coach-wasm is the one crate that
      # is allowed wasm-bindgen, and the bindings would be impossible without
      # it. The core staying clean is what this protects.
      # The page calls these by name through the generated module. A rename in
      # the crate with no matching edit here is a blank screen, and nothing
      # else in the build would notice.
      - name: The page and the bindings agree on the API
        run: |
          missing=0
          for call in 'new Session(' '.characters()' '.set_roles(' '.recommendation()' '.notices()' '.professions()' '.quests(' '.gear('; do
            grep -qF "$call" apps/web/index.html || { echo "::error::apps/web/index.html no longer calls $call"; missing=1; }
          done
          for method in 'pub fn characters(&self)' 'pub fn set_roles(&mut self' 'pub fn recommendation(&self)' 'pub fn notices(&self)' 'pub fn professions(&self)' 'pub fn quests(&self, key: &str)' 'pub fn gear(&self, key: &str)'; do
            grep -qF "$method" crates/wow-coach-wasm/src/lib.rs || { echo "::error::wow-coach-wasm no longer exposes $method"; missing=1; }
          done
          exit $missing

      # A static `import` of the engine is resolved before the module body
      # runs, so a missing or broken ./pkg/ discards the whole script: no
      # listeners, no error on screen, just a page where nothing responds.
      # That failure is invisible to every other check here, so it gets its
      # own. The engine is loaded with a dynamic import() at the foot of the
      # script instead, after the interface is wired up.
      - name: The page does not statically import the engine
        run: |
          if grep -nE '^[[:space:]]*import[^(]' apps/web/index.html; then
            echo "::error::apps/web/index.html has a top-level static import." \
                 "Load the engine with a dynamic import() at the end of the script" \
                 "instead, or a missing build will silently kill the page."
            exit 1
          fi

      # The grep above compares two files as text, which cannot see the seam
      # where both halves are individually correct: a method exposed as a
      # getter, a field renamed in serde, a listener that never attaches. Both
      # bugs this suite has caught so far were of exactly that kind and passed
      # every other check here. apps/web/test/README.md has the detail.
      - name: The page works in a browser
        run: |
          cd apps/web/test
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node page.mjs

      - name: No JS shim in the core
        run: |
          if cargo tree -p wow-coach-core --target wasm32-unknown-unknown -e normal \
               | grep -E 'wasm-bindgen|js-sys'; then
            echo "::error::wasm-bindgen reached the core. Something enabled chrono's" \
                 "clock feature (or added a JS-backed dependency). The core takes the" \
                 "time as a parameter and must not need a JS shim."
            exit 1
          fi

  desktop-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  desktop-rust:
    name: Desktop Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Generate native icons from tracked SVG
        run: npm run tauri icon src-tauri/icons/icon.svg
        working-directory: apps/desktop
      - run: cargo check -p wow-coach-desktop --features desktop-runtime
